<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" th:href="@{/css/courses.css}">
    <title>Document</title>
</head>
<body>

<ul>
    <li th:each="course : ${courses}">
        <a th:text="${course.id}" th:href="@{/course/detail/{id}(id=${course.id})}"></a>
        <strong th:text="${course.name}"></strong>
        <a th:text="${course.profesor.name}" th:href="@{/profesor/detail/{id}(id=${course.profesor.id})}"></a>
    </li>
</ul>

</body>
</html>
